    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=AR">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->

    <style>
        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            overscroll-behavior-y: contain; /* Prevent pull-to-refresh on mobile */
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .view-section {
            display: none;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        
        .view-section.active {
            display: flex;
            flex-direction: column;
        }

        /* Camera & AR Layers */
        .ar-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background-color: #000;
            overflow: hidden;
        }
        
        .ar-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .ar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass to video if needed */
        }

        .ar-interactive {
            pointer-events: auto; /* Enable interaction for editor */
        }

        /* Grid Overlay */
        .grid-overlay {
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
            z-index: 2;
        }
        
        .center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            z-index: 3;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* SVG Editor Nodes */
        .path-node {
            cursor: grab;
            transition: r 0.2s;
        }
        .path-node:hover {
            r: 12;
        }
        .path-node:active {
            cursor: grabbing;
        }
    </style>
</head>

    <script>
        // --- UTILITIES ---
        const Utils = {
            generateId: () => Math.random().toString(36).substring(2, 9),
            
            // Map normalized coordinates (0-1) to actual pixel dimensions
            mapToPixels: (normX, normY, width, height) => ({
                x: normX * width,
                y: normY * height
            }),
            
            // Map pixel coordinates to normalized (0-1)
            mapToNormalized: (pxX, pxY, width, height) => ({
                x: Math.max(0, Math.min(1, pxX / width)),
                y: Math.max(0, Math.min(1, pxY / height))
            }),

            distance: (p1, p2) => Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2)),

            // Ramer-Douglas-Peucker algorithm for path simplification
            simplifyPath: (points, epsilon) => {
                if (points.length <= 2) return points;

                let dmax = 0;
                let index = 0;
                const end = points.length - 1;

                for (let i = 1; i < end; i++) {
                    const d = Utils.perpendicularDistance(points[i], points[0], points[end]);
                    if (d > dmax) {
                        index = i;
                        dmax = d;
                    }
                }

                if (dmax > epsilon) {
                    const recResults1 = Utils.simplifyPath(points.slice(0, index + 1), epsilon);
                    const recResults2 = Utils.simplifyPath(points.slice(index), epsilon);
                    return recResults1.slice(0, recResults1.length - 1).concat(recResults2);
                } else {
                    return [points[0], points[end]];
                }
            },

            perpendicularDistance: (point, lineStart, lineEnd) => {
                let dx = lineEnd.x - lineStart.x;
                let dy = lineEnd.y - lineStart.y;
                
                const mag = Math.sqrt(dx*dx + dy*dy);
                if(mag > 0){ dx /= mag; dy /= mag; }
                
                const pvx = point.x - lineStart.x;
                const pvy = point.y - lineStart.y;
                
                const pvdot = dx * pvx + dy * pvy;
                const dsx = pvdot * dx;
                const dsy = pvdot * dy;
                
                const ax = pvx - dsx;
                const ay = pvy - dsy;
                
                return Math.sqrt(ax*ax + ay*ay);
            }
        };

        // --- INDEXED DB WRAPPER ---
        const DB = {
            dbName: 'ARRopePathDB',
            storeName: 'knots',
            db: null,

            init: async () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB.dbName, 1);
                    
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(DB.storeName)) {
                            db.createObjectStore(DB.storeName, { keyPath: 'id' });
                        }
                    };
                    
                    request.onsuccess = async (e) => {
                        DB.db = e.target.result;
                        await DB.checkAndInjectSampleData();
                        resolve();
                    };
                    
                    request.onerror = (e) => reject(e.target.error);
                });
            },

            getAll: async () => {
                return new Promise((resolve) => {
                    const tx = DB.db.transaction(DB.storeName, 'readonly');
                    const store = tx.objectStore(DB.storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                });
            },

            save: async (knot) => {
                return new Promise((resolve) => {
                    knot.updatedAt = new Date().toISOString();
                    const tx = DB.db.transaction(DB.storeName, 'readwrite');
                    const store = tx.objectStore(DB.storeName);
                    store.put(knot);
                    tx.oncomplete = () => resolve(knot);
                });
            },

            delete: async (id) => {
                return new Promise((resolve) => {
                    const tx = DB.db.transaction(DB.storeName, 'readwrite');
                    const store = tx.objectStore(DB.storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                });
            },

            checkAndInjectSampleData: async () => {
                const existing = await DB.getAll();
                if (existing.length === 0) {
                    console.log("Injecting sample knots...");
                    const samples = [
                        {
                            id: 'sample-1',
                            name: 'เงื่อนขัดสมาธิ (Square Knot)',
                            desc: 'เงื่อนพื้นฐานสำหรับต่อเชือกขนาดเท่ากัน',
                            difficulty: 'Beginner',
                            steps: 2,
                            createdAt: new Date().toISOString(),
                            pathData: [
                                {x: 0.2, y: 0.5, type: 'START', conf: 1.0},
                                {x: 0.4, y: 0.3, type: 'NORMAL', conf: 0.9},
                                {x: 0.6, y: 0.3, type: 'CROSS', conf: 0.9},
                                {x: 0.8, y: 0.5, type: 'NORMAL', conf: 0.9},
                                {x: 0.6, y: 0.7, type: 'CROSS', conf: 0.9},
                                {x: 0.4, y: 0.7, type: 'NORMAL', conf: 0.9},
                                {x: 0.2, y: 0.5, type: 'END', conf: 1.0}
                            ],
                            thumbnail: 'https://placehold.co/400x300/1e293b/4f46e5?text=Square+Knot'
                        },
                        {
                            id: 'sample-2',
                            name: 'เงื่อนเลขแปด (Figure-Eight)',
                            desc: 'เงื่อนห้ามรูดที่แข็งแรงและแก้ง่าย',
                            difficulty: 'Intermediate',
                            steps: 3,
                            createdAt: new Date().toISOString(),
                            pathData: [
                                {x: 0.5, y: 0.1, type: 'START', conf: 1.0},
                                {x: 0.3, y: 0.4, type: 'NORMAL', conf: 0.9},
                                {x: 0.7, y: 0.6, type: 'CROSS', conf: 0.9},
                                {x: 0.5, y: 0.9, type: 'LOOP', conf: 0.9},
                                {x: 0.3, y: 0.6, type: 'NORMAL', conf: 0.9},
                                {x: 0.5, y: 0.4, type: 'CROSS', conf: 0.9},
                                {x: 0.7, y: 0.1, type: 'END', conf: 1.0}
                            ],
                            thumbnail: 'https://placehold.co/400x300/1e293b/10b981?text=Figure+8'
                        }
                    ];
                    for (let s of samples) await DB.save(s);
                }
            }
        };

        // --- STREAMING_CHUNK:Camera & Detection Module ---
        const Camera = {
            stream: null,
            videoEl: null,
            facingMode: 'environment', // Start with rear camera
            active: false,
            
            init: (videoElementId) => {
                Camera.videoEl = document.getElementById(videoElementId);
            },

            start: async () => {
                if (Camera.stream) Camera.stop();
                
                try {
                    const constraints = {
                        video: {
                            facingMode: Camera.facingMode,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    };
                    
                    Camera.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    Camera.videoEl.srcObject = Camera.stream;
                    Camera.active = true;
                    
                    // Return promise that resolves when video is playing
                    return new Promise((resolve) => {
                        Camera.videoEl.onloadedmetadata = () => {
                            Camera.videoEl.play();
                            resolve();
                        };
                    });
                } catch (err) {
                    console.error("Camera access error:", err);
                    alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาให้สิทธิ์การใช้งานกล้อง");
                    return Promise.reject(err);
                }
            },

            stop: () => {
                if (Camera.stream) {
                    Camera.stream.getTracks().forEach(track => track.stop());
                    Camera.stream = null;
                }
                Camera.active = false;
            },

            switchCamera: async () => {
                Camera.facingMode = Camera.facingMode === 'user' ? 'environment' : 'user';
                await Camera.start();
            }
        };

        const Detector = {
            isRecording: false,
            pathPoints: [],
            lastProcessTime: 0,
            canvas: null,
            ctx: null,
            overlayCanvas: null,
            overlayCtx: null,
            fpsEl: null,
            frames: 0,
            lastFpsTime: 0,

            // Config for heuristic detection (Tracking Bright Colors / Red)
            downscaleRatio: 0.25, // Process at 25% resolution for speed
            minDistNorm: 0.02,    // Minimum normalized distance to record a new point

            init: () => {
                Detector.canvas = document.getElementById('cv-canvas');
                Detector.ctx = Detector.canvas.getContext('2d', { willReadFrequently: true });
                Detector.overlayCanvas = document.getElementById('recorder-overlay');
                Detector.overlayCtx = Detector.overlayCanvas.getContext('2d');
                Detector.fpsEl = document.getElementById('recorder-fps');
            },

            start: () => {
                Detector.isRecording = true;
                Detector.pathPoints = [];
                Detector.frames = 0;
                Detector.lastFpsTime = performance.now();
                Detector.resizeCanvases();
                document.getElementById('recording-indicator').classList.remove('hidden');
                document.getElementById('btn-record-inner').classList.remove('bg-red-500');
                document.getElementById('btn-record-inner').classList.add('bg-gray-400', 'scale-50', 'rounded-md');
                Detector.loop();
            },

            stop: () => {
                Detector.isRecording = false;
                document.getElementById('recording-indicator').classList.add('hidden');
                document.getElementById('btn-record-inner').classList.add('bg-red-500');
                document.getElementById('btn-record-inner').classList.remove('bg-gray-400', 'scale-50', 'rounded-md');
                
                // Clear overlay
                Detector.overlayCtx.clearRect(0, 0, Detector.overlayCanvas.width, Detector.overlayCanvas.height);
                
                return Detector.pathPoints; // Return raw points
            },

            resizeCanvases: () => {
                const rect = Camera.videoEl.getBoundingClientRect();
                
                // Visible overlay
                Detector.overlayCanvas.width = rect.width;
                Detector.overlayCanvas.height = rect.height;
                
                // Processing canvas (downscaled)
                Detector.canvas.width = rect.width * Detector.downscaleRatio;
                Detector.canvas.height = rect.height * Detector.downscaleRatio;
            },

            loop: () => {
                if (!Detector.isRecording) return;
                
                const now = performance.now();
                Detector.frames++;
                if (now - Detector.lastFpsTime >= 1000) {
                    Detector.fpsEl.innerText = Detector.frames;
                    Detector.frames = 0;
                    Detector.lastFpsTime = now;
                }

                Detector.processFrame();
                Detector.drawLivePath();
                
                requestAnimationFrame(Detector.loop);
            },

            processFrame: () => {
                if (!Camera.videoEl || Camera.videoEl.videoWidth === 0) return;

                const cw = Detector.canvas.width;
                const ch = Detector.canvas.height;
                
                // Draw video to hidden canvas
                Detector.ctx.drawImage(Camera.videoEl, 0, 0, cw, ch);
                const imageData = Detector.ctx.getImageData(0, 0, cw, ch);
                const data = imageData.data;

                // Simple heuristic: Find center of mass of brightest pixels (simulating a bright colored rope)
                let sumX = 0, sumY = 0, count = 0;
                
                // Scan pixels (step by 4 for RGBA, step by 8 to skip pixels for speed)
                for (let i = 0; i < data.length; i += 16) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    
                    // Simple threshold: bright red/orange OR just high luminance
                    // For MVP, tracking bright objects
                    const luminance = (0.299*r + 0.587*g + 0.114*b);
                    
                    if (luminance > 200) { // High brightness threshold
                        const pixelIndex = i / 4;
                        const x = pixelIndex % cw;
                        const y = Math.floor(pixelIndex / cw);
                        sumX += x;
                        sumY += y;
                        count++;
                    }
                }

                if (count > 20) { // Need enough pixels to be confident
                    const avgX = sumX / count;
                    const avgY = sumY / count;
                    
                    const normX = avgX / cw;
                    const normY = avgY / ch;
                    
                    // Flip X if using front camera to match mirrored display
                    const finalX = Camera.facingMode === 'user' ? 1 - normX : normX;

                    const newPoint = {
                        x: finalX,
                        y: normY,
                        timestamp: Date.now(),
                        type: 'NORMAL',
                        conf: Math.min(1.0, count / 500) // pseudo-confidence
                    };

                    // Add point if it's far enough from the last one
                    if (Detector.pathPoints.length === 0) {
                        newPoint.type = 'START';
                        Detector.pathPoints.push(newPoint);
                    } else {
                        const lastPoint = Detector.pathPoints[Detector.pathPoints.length - 1];
                        if (Utils.distance(lastPoint, newPoint) > Detector.minDistNorm) {
                            Detector.pathPoints.push(newPoint);
                            document.getElementById('debug-pts').innerText = Detector.pathPoints.length;
                        }
                    }
                }
            },

            drawLivePath: () => {
                const ctx = Detector.overlayCtx;
                const w = Detector.overlayCanvas.width;
                const h = Detector.overlayCanvas.height;
                
                ctx.clearRect(0, 0, w, h);
                
                if (Detector.pathPoints.length < 2) return;

                ctx.beginPath();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#10b981'; // Tailwind Secondary
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const first = Utils.mapToPixels(Detector.pathPoints[0].x, Detector.pathPoints[0].y, w, h);
                ctx.moveTo(first.x, first.y);

                for (let i = 1; i < Detector.pathPoints.length; i++) {
                    const pt = Utils.mapToPixels(Detector.pathPoints[i].x, Detector.pathPoints[i].y, w, h);
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
                
                // Draw current head
                const last = Detector.pathPoints[Detector.pathPoints.length - 1];
                const head = Utils.mapToPixels(last.x, last.y, w, h);
                ctx.beginPath();
                ctx.arc(head.x, head.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444'; // Red dot for current head
                ctx.fill();
            }
        };

        // --- STREAMING_CHUNK:Editor Module ---
        const Editor = {
            svg: null,
            bgImg: null,
            pathData: [],
            mode: 'select', // select, add, delete
            selectedNodeIdx: -1,
            isDragging: false,
            
            init: () => {
                Editor.svg = document.getElementById('editor-svg');
                Editor.bgImg = document.getElementById('editor-bg-img');
                
                Editor.svg.addEventListener('mousedown', Editor.handlePointerDown);
                Editor.svg.addEventListener('mousemove', Editor.handlePointerMove);
                Editor.svg.addEventListener('mouseup', Editor.handlePointerUp);
                
                // Touch support
                Editor.svg.addEventListener('touchstart', (e) => { e.preventDefault(); Editor.handlePointerDown(e.touches[0]); }, {passive: false});
                Editor.svg.addEventListener('touchmove', (e) => { e.preventDefault(); Editor.handlePointerMove(e.touches[0]); }, {passive: false});
                Editor.svg.addEventListener('touchend', Editor.handlePointerUp);
            },

            loadData: (points, imageSrc) => {
                // Simplify path immediately for easier editing
                Editor.pathData = Utils.simplifyPath(points, 0.01);
                
                if (Editor.pathData.length > 0) {
                    Editor.pathData[0].type = 'START';
                    Editor.pathData[Editor.pathData.length - 1].type = 'END';
                }
                
                if (imageSrc) Editor.bgImg.src = imageSrc;
                Editor.selectedNodeIdx = -1;
                document.getElementById('editor-context-menu').classList.add('hidden');
                Editor.render();
            },

            setMode: (mode) => {
                Editor.mode = mode;
                document.querySelectorAll('.tool-btn').forEach(b => {
                    b.classList.remove('bg-primary/20', 'text-primary');
                    b.classList.add('bg-gray-800', 'text-gray-400');
                });
                document.getElementById('tool-' + mode).classList.remove('bg-gray-800', 'text-gray-400');
                document.getElementById('tool-' + mode).classList.add('bg-primary/20', 'text-primary');
            },

            smoothPath: () => {
                Editor.pathData = Utils.simplifyPath(Editor.pathData, 0.02);
                Editor.render();
            },

            getCoords: (e) => {
                const rect = Editor.svg.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return Utils.mapToNormalized(clientX - rect.left, clientY - rect.top, rect.width, rect.height);
            },

            handlePointerDown: (e) => {
                const target = e.target;
                if (target.tagName === 'circle') {
                    const idx = parseInt(target.getAttribute('data-idx'));
                    
                    if (Editor.mode === 'delete') {
                        Editor.pathData.splice(idx, 1);
                        Editor.selectedNodeIdx = -1;
                        document.getElementById('editor-context-menu').classList.add('hidden');
                        Editor.render();
                        return;
                    }

                    Editor.selectedNodeIdx = idx;
                    Editor.isDragging = true;
                    
                    // Show context menu
                    const cm = document.getElementById('editor-context-menu');
                    cm.classList.remove('hidden');
                    document.getElementById('point-type-select').value = Editor.pathData[idx].type || 'NORMAL';
                    document.getElementById('point-conf-display').innerText = (Editor.pathData[idx].conf * 100).toFixed(0) + '%';
                    
                } else if (Editor.mode === 'add') {
                    const normCoords = Editor.getCoords(e);
                    // Append for MVP (advanced logic would insert between nearest segment)
                    Editor.pathData.push({
                        x: normCoords.x,
                        y: normCoords.y,
                        type: 'NORMAL',
                        conf: 1.0
                    });
                    Editor.render();
                } else {
                    Editor.selectedNodeIdx = -1;
                    document.getElementById('editor-context-menu').classList.add('hidden');
                }
            },

            handlePointerMove: (e) => {
                if (Editor.isDragging && Editor.selectedNodeIdx > -1 && Editor.mode === 'select') {
                    const normCoords = Editor.getCoords(e);
                    Editor.pathData[Editor.selectedNodeIdx].x = normCoords.x;
                    Editor.pathData[Editor.selectedNodeIdx].y = normCoords.y;
                    Editor.render();
                }
            },

            handlePointerUp: () => {
                Editor.isDragging = false;
            },

            updatePointType: (type) => {
                if (Editor.selectedNodeIdx > -1) {
                    Editor.pathData[Editor.selectedNodeIdx].type = type;
                    Editor.render();
                }
            },

            render: () => {
                const rect = Editor.svg.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                
                // Clear SVG
                Editor.svg.innerHTML = '';
                
                if (Editor.pathData.length < 2) return;

                // Draw Path Lines
                let d = `M ${Editor.pathData[0].x * w} ${Editor.pathData[0].y * h}`;
                for (let i = 1; i < Editor.pathData.length; i++) {
                    d += ` L ${Editor.pathData[i].x * w} ${Editor.pathData[i].y * h}`;
                }
                
                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', d);
                pathEl.setAttribute('stroke', '#4f46e5'); // Primary
                pathEl.setAttribute('stroke-width', '4');
                pathEl.setAttribute('fill', 'none');
                pathEl.setAttribute('stroke-linejoin', 'round');
                Editor.svg.appendChild(pathEl);

                // Draw Nodes
                Editor.pathData.forEach((pt, idx) => {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', pt.x * w);
                    circle.setAttribute('cy', pt.y * h);
                    circle.setAttribute('r', idx === Editor.selectedNodeIdx ? '10' : '8');
                    circle.setAttribute('data-idx', idx);
                    circle.classList.add('path-node');
                    
                    // Colors based on type
                    let fill = '#3b82f6'; // normal
                    if (pt.type === 'START') fill = '#10b981'; // green
                    else if (pt.type === 'END') fill = '#ef4444'; // red
                    else if (pt.type === 'CROSS') fill = '#f59e0b'; // orange
                    else if (pt.type === 'KEY') fill = '#d946ef'; // purple
                    
                    if (idx === Editor.selectedNodeIdx) {
                        circle.setAttribute('stroke', 'white');
                        circle.setAttribute('stroke-width', '3');
                    }

                    circle.setAttribute('fill', fill);
                    Editor.svg.appendChild(circle);
                });
            }
        };

        // --- STREAMING_CHUNK:Practice Mode Module ---
        const Practice = {
            activeKnot: null,
            targetPath: [],
            currentStep: 0, // In MVP, we treat the whole path as 1 step for simplicity, or divide if marked.
            svg: null,
            canvas: null,
            ctx: null,
            isTracking: false,
            
            init: () => {
                Practice.svg = document.getElementById('practice-target-svg');
                Practice.canvas = document.getElementById('practice-user-overlay');
                Practice.ctx = Practice.canvas.getContext('2d');
            },

            loadKnot: async (knot) => {
                Practice.activeKnot = knot;
                Practice.targetPath = knot.pathData;
                Practice.currentStep = 0;
                document.getElementById('practice-knot-name').innerText = knot.name;
                
                // Render SVG Target
                Practice.resizeCanvas();
                Practice.renderTarget();
                
                // Start Camera
                Camera.init('practice-video');
                await Camera.start();
                
                // Start tracker
                Practice.isTracking = true;
                Detector.init(); // Reuse detector setup
                Detector.canvas = document.createElement('canvas'); // hidden processing
                Detector.ctx = Detector.canvas.getContext('2d', {willReadFrequently:true});
                Detector.pathPoints = [];
                Practice.loop();
            },

            stop: () => {
                Practice.isTracking = false;
                Camera.stop();
            },

            resizeCanvas: () => {
                const rect = document.getElementById('practice-video').getBoundingClientRect();
                Practice.canvas.width = rect.width;
                Practice.canvas.height = rect.height;
            },

            renderTarget: () => {
                if (!Practice.activeKnot) return;
                const rect = Practice.canvas.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                
                Practice.svg.innerHTML = '';
                
                let d = `M ${Practice.targetPath[0].x * w} ${Practice.targetPath[0].y * h}`;
                for (let i = 1; i < Practice.targetPath.length; i++) {
                    d += ` L ${Practice.targetPath[i].x * w} ${Practice.targetPath[i].y * h}`;
                }
                
                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', d);
                pathEl.setAttribute('stroke', 'rgba(255,255,255,0.3)');
                pathEl.setAttribute('stroke-width', '10');
                pathEl.setAttribute('stroke-dasharray', '15, 10');
                pathEl.setAttribute('fill', 'none');
                Practice.svg.appendChild(pathEl);
            },

            loop: () => {
                if (!Practice.isTracking) return;
                
                const rect = document.getElementById('practice-video').getBoundingClientRect();
                Detector.canvas.width = rect.width * 0.25;
                Detector.canvas.height = rect.height * 0.25;
                
                // Process frame to find point
                if (Camera.videoEl.readyState === Camera.videoEl.HAVE_ENOUGH_DATA) {
                    Detector.ctx.drawImage(Camera.videoEl, 0, 0, Detector.canvas.width, Detector.canvas.height);
                    // (Simplified re-use of detection logic inline for practice mode)
                    const imgData = Detector.ctx.getImageData(0,0,Detector.canvas.width, Detector.canvas.height);
                    let sumX=0, sumY=0, count=0;
                    for(let i=0; i<imgData.data.length; i+=16){
                        if((0.299*imgData.data[i] + 0.587*imgData.data[i+1] + 0.114*imgData.data[i+2]) > 200){
                            sumX += (i/4)%Detector.canvas.width; sumY += Math.floor((i/4)/Detector.canvas.width); count++;
                        }
                    }
                    if(count > 20) {
                        const px = sumX/count/Detector.canvas.width;
                        const py = sumY/count/Detector.canvas.height;
                        const finalX = Camera.facingMode === 'user' ? 1 - px : px;
                        
                        Practice.updateUserTracking({x: finalX, y: py});
                    }
                }
                
                requestAnimationFrame(Practice.loop);
            },

            updateUserTracking: (pt) => {
                // Add to user path
                Detector.pathPoints.push(pt);
                if(Detector.pathPoints.length > 50) Detector.pathPoints.shift(); // Keep tail
                
                // Draw trailing path
                const ctx = Practice.ctx;
                const w = Practice.canvas.width;
                const h = Practice.canvas.height;
                ctx.clearRect(0,0,w,h);
                
                ctx.beginPath();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#10b981';
                ctx.lineCap = 'round';
                const first = Utils.mapToPixels(Detector.pathPoints[0].x, Detector.pathPoints[0].y, w, h);
                ctx.moveTo(first.x, first.y);
                for(let i=1; i<Detector.pathPoints.length; i++){
                    const p = Utils.mapToPixels(Detector.pathPoints[i].x, Detector.pathPoints[i].y, w, h);
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();

                // Calculate naive progress based on closest point in target path to current head
                if (Practice.targetPath.length > 0) {
                    let minD = Infinity;
                    let closestIdx = 0;
                    for(let i=0; i<Practice.targetPath.length; i++){
                        const d = Utils.distance(pt, Practice.targetPath[i]);
                        if(d < minD){ minD = d; closestIdx = i; }
                    }
                    
                    // If way off track
                    const fb = document.getElementById('practice-feedback');
                    if (minD > 0.15) {
                        fb.classList.remove('opacity-0');
                        fb.querySelector('span').innerText = 'ห่างจากเส้นทาง!';
                        fb.querySelector('i').className = 'ph ph-warning-circle text-red-500';
                    } else {
                        fb.classList.add('opacity-0');
                    }

                    const progress = Math.min(100, Math.max(0, (closestIdx / (Practice.targetPath.length-1)) * 100));
                    document.getElementById('practice-progress-bar').style.width = `${progress}%`;
                    document.getElementById('practice-score').innerText = `${Math.round(progress)}%`;
                }
            }
        };

        // --- STREAMING_CHUNK:Main Application Logic ---
        const App = {
            views: ['dashboard', 'recorder', 'editor', 'library', 'practice'],
            
            init: async () => {
                await DB.init();
                Editor.init();
                Practice.init();
                App.updateDashboardStats();
                
                // Handle resize for editor
                window.addEventListener('resize', () => {
                    if(!document.getElementById('view-editor').classList.contains('hidden')) {
                        Editor.render();
                    }
                });
            },

            switchView: (viewId) => {
                App.views.forEach(v => {
                    document.getElementById(`view-${v}`).classList.remove('active');
                });
                document.getElementById(`view-${viewId}`).classList.add('active');
                
                if (viewId === 'library') App.renderLibrary();
                if (viewId === 'dashboard') App.updateDashboardStats();
                
                // Cleanup camera if leaving relevant views
                if (viewId !== 'recorder' && viewId !== 'practice') {
                    Camera.stop();
                    if(Detector.isRecording) Detector.stop();
                    Practice.stop();
                }
            },

            // --- Dashboard ---
            updateDashboardStats: async () => {
                const knots = await DB.getAll();
                document.getElementById('stat-total-knots').innerText = knots.length;
                
                const list = document.getElementById('recent-knots-list');
                list.innerHTML = '';

                    list.innerHTML += `
                        <div class="bg-darkCard p-3 rounded-xl border border-gray-800 flex items-center gap-4 cursor-pointer hover:bg-gray-800 transition" onclick="App.openPractice('${knot.id}')">
                            <div class="w-12 h-12 bg-gray-700 rounded-lg flex-shrink-0 flex items-center justify-center overflow-hidden">
                                <img src="${knot.thumbnail || 'https://placehold.co/100/1e293b/fff?text=Knot'}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-grow">
                                <h3 class="font-medium text-sm">${knot.name}</h3>
                                <p class="text-xs text-gray-400">${knot.difficulty} • ${knot.steps} ขั้นตอน</p>
                            </div>
                            <i class="ph ph-caret-right text-gray-500"></i>
                        </div>
                    `;
                });
            },

            // --- Recorder ---
            startRecording: async () => {
                App.switchView('recorder');
                Camera.init('recorder-video');
                Detector.init();
                await Camera.start();
                // Show grid
                document.getElementById('recorder-grid').classList.remove('hidden');
                document.getElementById('recorder-crosshair').classList.remove('hidden');
                document.getElementById('recorder-debug').classList.remove('hidden');
            },

            toggleRecording: () => {
                if (Detector.isRecording) {
                    const rawPoints = Detector.stop();
                    
                    // Capture a snapshot for the editor background
                    const tmpCanvas = document.createElement('canvas');
                    tmpCanvas.width = Camera.videoEl.videoWidth;
                    tmpCanvas.height = Camera.videoEl.videoHeight;
                    tmpCanvas.getContext('2d').drawImage(Camera.videoEl, 0, 0);
                    const bgSrc = tmpCanvas.toDataURL('image/jpeg', 0.5);
                    
                    Camera.stop();
                    
                    if (rawPoints.length < 2) {
                        alert("บันทึกเส้นทางไม่เพียงพอ กรุณาลองใหม่");
                        App.switchView('dashboard');
                        return;
                    }
                    
                    // Go to editor
                    App.switchView('editor');
                    
                    // Small delay to let DOM render before rect calcs
                    setTimeout(() => {
                        Editor.loadData(rawPoints, bgSrc);

                } else {
                    document.getElementById('recorder-grid').classList.add('hidden');
                    document.getElementById('recorder-crosshair').classList.add('hidden');
                    Detector.start();
                }
            },
            
            stopRecordingAndExit: () => {
                if(Detector.isRecording) Detector.stop();
                Camera.stop();
                App.switchView('dashboard');
            },

            // --- Editor ---
            saveTemplate: async () => {
                const name = document.getElementById('edit-knot-name').value || 'เงื่อนใหม่ (ไม่มีชื่อ)';
                
                const newKnot = {
                    id: 'knot-' + Utils.generateId(),

            // --- Library ---
            renderLibrary: async () => {

                if(knots.length === 0){

                            <div class="absolute top-2 right-2 bg-black/50 backdrop-blur px-2 py-1 rounded text-xs">

                            </div>

                                <div class="flex gap-2">
                                    <button onclick="App.openPractice('${knot.id}')" class="flex-grow bg-primary text-white py-2 rounded-xl text-sm font-medium">
                                        ฝึกฝน
                                    </button>
                                    <button onclick="App.deleteKnot('${knot.id}')" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl">

            deleteKnot: async (id) => {

            // --- Practice ---
            openPractice: async (id) => {
                const knots = await DB.getAll();
                const knot = knots.find(k => k.id === id);
                if (knot) {
                    App.switchView('practice');
                    Practice.loadKnot(knot);
                }
            }
        };

        // Boot
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
            
            // Register PWA Service Worker inline if possible, or assume external
            if ('serviceWorker' in navigator) {
                // Since this needs to be a single file artifact delivery but SW requires a separate file logically,
                // we assume sw.js is deployed alongside. 
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW init fail (expected in preview)', err));
            }
        });
    </script>
</body>
</html>
